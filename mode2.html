<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>中青年人群肥胖风险预测系统（EFA模式二） | Obesity Risk Prediction</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <h1>中青年人群肥胖风险预测系统</h1>
  <nav class="mode-nav">
    <a class="mode-link" href="index.html">EFA模式一</a>
    <a class="mode-link active" href="mode2.html">EFA模式二</a>
    <a class="mode-link" href="entropy.html">熵权法</a>
  </nav>
</header>

<main class="container">
  <form id="predict-form">
    <section class="card">
      <h2>一、膳食模式（请回忆您近一年的平常食用频率）</h2>
      <div id="grp-questions"></div>
    </section>

    <section class="card">
      <h2>二、生活方式与家族史</h2>
      <div class="q-item">
        <label class="q-label">您是否有规律运动的习惯？</label>
        <div class="radio-row">
          <label class="radio-opt"><input type="radio" name="exercise" value="1" required /><span>是</span></label>
          <label class="radio-opt"><input type="radio" name="exercise" value="2" required /><span>否</span></label>
        </div>
      </div>
      <div class="q-item">
        <label class="q-label">您本人或直系亲属（父母/子女、祖父母/外祖父母）是否曾被诊断为肥胖？</label>
        <div class="radio-row">
          <label class="radio-opt"><input type="radio" name="fam_obesity" value="1" required /><span>是</span></label>
          <label class="radio-opt"><input type="radio" name="fam_obesity" value="0" required /><span>否</span></label>
        </div>
      </div>
      <div class="q-item">
        <label class="q-label">您的吸烟状态？</label>
        <div class="radio-row">
          <label class="radio-opt"><input type="radio" name="smoking" value="1" required /><span>从不吸烟</span></label>
          <label class="radio-opt"><input type="radio" name="smoking" value="2" required /><span>已经戒烟</span></label>
          <label class="radio-opt"><input type="radio" name="smoking" value="3" required /><span>目前仍在吸烟</span></label>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>三、进食行为问卷（EBQ-18）</h2>
      <p class="q-desc">请根据您近期的真实感受，选择您对以下每句话的同意程度。</p>
      <div id="ebq-questions"></div>
    </section>

    <button type="submit" class="submit-btn">开始预测</button>
  </form>

  <div id="result" hidden></div>
</main>

<footer class="site-footer">
  <p>仅供研究参考，不能替代医疗诊断。</p>
</footer>

<script src="script_mode2.js"></script>
</body>
</html>
